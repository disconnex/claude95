name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # to publish releases from v* tags

jobs:
  gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r gateway/requirements.txt
      - run: python -m unittest -v test_claude95d
        working-directory: gateway

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 make
      - run: make -C client   # builds and runs the Windows 95 compatibility check
      - uses: actions/upload-artifact@v4
        with:
          name: CLAUDE95
          path: client/build/CLAUDE95.EXE
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd client/build
          zip -9 claude95-${GITHUB_REF_NAME}.zip CLAUDE95.EXE
          gh release create "$GITHUB_REF_NAME" claude95-${GITHUB_REF_NAME}.zip \
            --repo "$GITHUB_REPOSITORY" --title "Claude 95 $GITHUB_REF_NAME" --generate-notes
